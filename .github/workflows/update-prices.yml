name: Update Stock Prices

on:
  schedule:
    # Runs Mon-Fri at 9:30 PM UTC = 5:30 PM ET in summer / 4:30 PM ET in winter,
    # so it is always after the 4:00 PM ET close (8:01 PM UTC was 3:01 PM ET in winter).
    # The watchlist checks rely on closing prices.
    - cron: '30 21 * * 1-5'
  workflow_dispatch: # allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Restore cached price history from previous runs
      - name: Restore price history
        uses: actions/cache@v4
        with:
          path: price_history.json
          key: price-history

      - name: Fetch and apply latest prices
        run: python update_prices.py --apply

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stocks/ data/ public/bars/
          git diff --cached --quiet && echo "No price changes" && exit 0
          git commit -m "Update stock prices ($(date -u +%Y-%m-%d))"
          git push
