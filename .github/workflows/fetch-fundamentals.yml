name: Fetch Fundamentals

# Keeps two caches current so a data review starts from reported figures instead
# of a web search:
#
#   data/fundamentals.json      reported revenue, EPS, net income, SBC, buybacks,
#                               EBITDA, debt, cash, cash flow — per stock, from
#                               Yahoo's fundamentals time series
#   data/earningsCalendar.json  report dates from Nasdaq's calendar, for the
#                               stocks Yahoo's quote endpoint leaves without one
#
# Neither file is part of the site bundle and NO STOCK FILE IS EDITED HERE: the
# figures feed `burry`, `debtSafety` and the model inputs, and entering those is
# a review. `python3 fetch_fundamentals.py --compare` shows where a stock file
# has drifted from what was reported; review_status.py reads the calendar to say
# which stocks have printed since their last review.
#
# Weekdays, an hour after the price job, so a company that reported before the
# open is picked up the same evening. The script commits nothing on a run where
# no company has filed anything new.

on:
  schedule:
    - cron: '53 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-fundamentals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch reported fundamentals
        run: python3 fetch_fundamentals.py --apply

      - name: Fill missing earnings dates
        run: python3 fetch_fundamentals.py --earnings --apply

      - name: Report drift and the review queue
        run: |
          python3 fetch_fundamentals.py --compare
          python3 review_status.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fundamentals.json data/earningsCalendar.json
          git diff --cached --quiet && echo "Nothing new reported" && exit 0
          git commit -m "Fetch fundamentals and earnings dates ($(date -u +%Y-%m-%d))"
          git pull --rebase
          git push
